# Copy to .github/workflows/deploy.yml in the IWSDK project.
# Repo Settings -> Pages -> Source: GitHub Actions.
# Also set  base: '/<your-repo-name>/'  in vite.config.ts (see docs/03-technical-spec.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test core
        run: npm test --if-present

      # Optional AI coach. VITE_COACH_PROXY_URL is a repository *variable* (a public
      # URL, not a secret). Unset or empty means the build has no coach button.
      # API keys never belong here: they live only in the proxy's own environment.
      - name: Build
        env:
          VITE_COACH_PROXY_URL: ${{ vars.VITE_COACH_PROXY_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
